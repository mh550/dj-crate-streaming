# Sourcing policy: Michael's settings. Read once at start-up by sourcing/policy.py; restart the crates and worker
# containers after an edit (docker compose up -d --build crates worker). A typo (unknown key, unknown version word,
# wrong type) stops the start with a message naming the key.
#
# THE RULE (Michael, 2026-10-17): we only download files good enough for DJing, whatever the playlist.
#     lossless (flac preferred, then wav / aiff / alac), or lossy at 256 kbps or more (mp3 / m4a).
# Streaming quality is NOT our business: Navidrome (or the client) transcodes that one file down per player.
# The four tier names below stay only because the code looks them up by name (the crate flag, import, the web
# client's old presets). They are identical on purpose; edit all four together.
#
# Every tier has exactly these keys:
#   allow / deny        file types we may / never take
#   min_lossy_bitrate   kbps floor for lossy files
#   speed_weight        0 = quality only, 1 = arrival time only
#   arrival_budget_s    an estimated arrival of this many seconds scores 50 of 100 on speed (unused at weight 0)
#   download_cap_Bps    our own download cap in bytes/s (0 = none)
#   strict_verify       true = reject a file that is not the quality it claims (a 128 kbps file re-encoded to 320,
#                       fake hi-res); false = accept with a warning
#
# Versions: we source the exact track the playlist row names (the Soulseek-style label stays in the title:
# "Title (Extended Mix)"). No version is preferred and none stands in for another, so there is no [versions.*]
# table. (Docs: docs/decisions.md D26.)

[tiers.low]
allow = ["flac", "wav", "aiff", "alac", "m4a", "mp3"]
deny = ["wma", "ra", "mid", "opus", "ogg"]
min_lossy_bitrate = 256
speed_weight = 0
arrival_budget_s = 60
download_cap_Bps = 0
strict_verify = true

