# beets config. Since M6 the worker container is the ONLY process that runs beets: it imports each verified
# download with `beet import -q -s -m -W` from its own <downloads>/.staging/<id>-<ts>/ folder (sourcing/filer.py)
# and runs `beet write` on that new file only after a *confirmed* MusicBrainz match (recording length agrees with
# the file). Do not run beet on the host.
# State (library.db, import log) lives in /srv/docker/beets, outside the repo.
# beets 1.6 sets up MusicBrainz BEFORE it reads the -c file, so any `musicbrainz:` settings (host, rate limit)
# belong in $BEETSDIR/config.yaml (BEETSDIR=/srv/docker/beets), not here. The worker needs none today.
#
# DO NOT run `beet write` / `beet modify` / `beet import -L` with writing on this library: beets 1.6 rewrites
# every field it knows, which collapses multi-valued GENRE/ISRC/ARTIST, garbles RELEASETYPE and adds zero
# DISCTOTAL/TRACKTOTAL (it did, 2026-10-15; repaired from the originals). Tag edits go through
# scripts/tag_cleanup.py's write_minimal. `beet move` is safe only after `tag_cleanup.py plan` shows what moves
# (its "Untouched songs beets would re-file" list), and only after a Navidrome scan of any tag change.
directory: /srv/music
library: /srv/docker/beets/library.db
statefile: /srv/docker/beets/state.pickle   # incremental history + resume state

import:
  # Only the worker's filer imports, always `beet import -q -s -m -W -l <log> <downloads>/.staging/<id>-<ts>/`
  # (sourcing/filer.py): -m moves the verified download out of its own staging folder (it overrides copy: below),
  # -W keeps the import itself from writing tags. Nothing is imported from /srv/incoming/library-import.
  copy: yes            # overridden by the filer's -m
  move: no             # overridden by the filer's -m
  write: no            # defence in depth: `beet modify`/`mbsync` then never write files by default; the filer's explicit `beet write` is unaffected
  log: /srv/docker/beets/import.log
  quiet_fallback: asis # an unmatched download goes in on its existing tags (-q runs)
  duplicate_action: keep   # copies and versions of one song coexist (spec Part 2); skip would drop every copy upgrade
  resume: yes          # never prompt: these runs are unattended
  incremental: yes     # skips folders already seen; every download has a fresh .staging/<id>-<ts>/ folder, so none is

paths:
  # Artist/Album (Year)/NN - Title; %if drops "(0000)" when the year is unknown and files no-album tracks under Singles/
  default: $albumartist/%if{$album,%if{$year,$album ($year),$album},Singles}/$track - $title
  comp: Compilations/%if{$year,$album ($year),$album}/$track - $title
  singleton: $artist/Singles/$title

ignore: ['.*', '*~', 'System Volume Information', 'lost+found', '_Serato_', '_Serato_Backup']
ignore_hidden: yes
asciify_paths: no
per_disc_numbering: no
threaded: yes
