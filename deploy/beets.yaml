# beets config for the one-time library import (and later sourcing hand-offs).
#   beet -c ~/projects/dj-crate-streaming/deploy/beets.yaml import --pretend /srv/incoming/library-import
# State (library.db, import log) lives in /srv/docker/beets, outside the repo.
#
# DO NOT run `beet write` / `beet modify` / `beet import -L` with writing on this library: beets 1.6 rewrites
# every field it knows, which collapses multi-valued GENRE/ISRC/ARTIST, garbles RELEASETYPE and adds zero
# DISCTOTAL/TRACKTOTAL (it did, 2026-10-15; repaired from the originals). Tag edits go through
# scripts/tag_cleanup.py's write_minimal. `beet move` is safe only after `tag_cleanup.py plan` shows what moves
# (its "Untouched songs beets would re-file" list), and only after a Navidrome scan of any tag change.
directory: /srv/music
library: /srv/docker/beets/library.db
statefile: /srv/docker/beets/state.pickle   # incremental history + resume state

import:
  copy: yes            # never move: /srv/incoming/library-import stays untouched
  move: no
  write: yes           # tags are written to the *copy* in /srv/music
  log: /srv/docker/beets/import.log
  quiet_fallback: asis # unmatched albums go in on their existing tags (-q runs)
  duplicate_action: keep   # copies and versions of one song coexist (spec Part 2); skip would drop every copy upgrade
  resume: yes          # never prompt: these runs are unattended
  incremental: yes     # re-running skips directories already seen — including skipped ones,
                       # so new files must land in a fresh /srv/incoming/<batch>/ dir (or use -I)

paths:
  # Artist/Album (Year)/NN - Title; %if drops "(0000)" when the year is unknown and files no-album tracks under Singles/
  default: $albumartist/%if{$album,%if{$year,$album ($year),$album},Singles}/$track - $title
  comp: Compilations/%if{$year,$album ($year),$album}/$track - $title
  singleton: $artist/Singles/$title

ignore: ['.*', '*~', 'System Volume Information', 'lost+found', '_Serato_', '_Serato_Backup']
ignore_hidden: yes
asciify_paths: no
per_disc_numbering: no
threaded: yes
