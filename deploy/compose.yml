# DJ box — Phase 0 stack. Source of truth lives in the repo (deploy/compose.yml);
# /srv/docker/compose.yml is a symlink to it. Run from /srv/docker so `.env` there
# (chmod 600, never committed) supplies the variables listed in deploy/.env.example.
#
#   cd /srv/docker && docker compose up -d navidrome
#
# Every published port binds 127.0.0.1; `tailscale serve` fronts them for the phone.
# Design notes: ../../ideas/dj-crate-streaming/phase0-options.md §2, §5, §6.
name: dj

services:
  navidrome:
    image: deluan/navidrome:latest
    user: "1000:1000"
    ports: ["127.0.0.1:4533:4533"]
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_DEFAULTDOWNSAMPLINGFORMAT: opus      # what maxBitRate-only requests get
      ND_TRANSCODINGCACHESIZE: 3GB
      ND_ENABLESHARING: "false"
      ND_AUTOIMPORTPLAYLISTS: "false"        # /srv/music/_playlists/*.m3u8 are *exports* (scripts/export_playlists.py);
                                             # auto-import would re-create every playlist as a duplicate on each scan.
                                             # To restore from the files: scripts/export_playlists.py restore (see its --help).
    volumes:
      - /srv/docker/navidrome:/data
      - /srv/music:/music:ro
    restart: unless-stopped

  crates:                                    # crate service + web client (this repo)
    user: "1000:1000"
    build:
      # Compose resolves relative paths against the directory of the compose file *as given*
      # (/srv/docker via the symlink), so a relative default would point at /srv. Require it.
      context: ${CRATES_SRC:?set CRATES_SRC=<repo checkout> in /srv/docker/.env}
    ports: ["127.0.0.1:4580:4580"]
    environment:
      SUBSONIC_URL: http://navidrome:4533
      SUBSONIC_PUBLIC_URL: ${SUBSONIC_PUBLIC_URL:-https://pop-os.taildf8564.ts.net}
      SUBSONIC_USER: ${ND_USER}
      SUBSONIC_PASS: ${ND_PASS}
      CRATES_DB: /data/crates.db
      CRATES_TRASH: /trash                   # status reports trash size/age; never emptied automatically
      SLSKD_URL: http://gluetun:5030         # slskd shares gluetun's network: search/rank/preview here. Approve in the web
                                             # client; the worker service below downloads (this one has no /srv/music or
                                             # /srv/incoming mounted, so `fetch --approve` refuses here)
      SLSKD_API_KEY: ${SLSKD_API_KEY}
    volumes:
      - /srv/docker/crates:/data
      - /srv/docker/_trash:/trash:ro         # runbook wanted /srv/_trash (needs root): see Needs Michael
    depends_on: [navidrome]
    restart: unless-stopped

  worker:                                  # D18: the only process that downloads or runs beets
    user: "1000:1000"
    build:
      context: ${CRATES_SRC:?set CRATES_SRC=<repo checkout> in /srv/docker/.env}
    command: ["python", "-m", "sourcing.cli", "worker"]
    environment:
      SUBSONIC_URL: http://navidrome:4533
      SUBSONIC_USER: ${ND_USER}
      SUBSONIC_PASS: ${ND_PASS}
      CRATES_DB: /data/crates.db
      SLSKD_URL: http://gluetun:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}        # optional; empty = no AcoustID lookup
      MUSIC_ROOT: /srv/music
      DOWNLOADS_ROOT: /srv/incoming/soulseek
      NAVIDROME_DB: /srv/docker/navidrome/navidrome.db
      BEETSDIR: /srv/docker/beets            # beets' own dir (uid 1000 has no home in the image)
      WORKER_POLL_S: "30"
    volumes:                               # identical paths: beets stores absolute paths in library.db
      - /srv/music:/srv/music
      - /srv/docker/beets:/srv/docker/beets
      - /srv/incoming/soulseek:/srv/incoming/soulseek
      - /srv/docker/crates:/data
      - /srv/docker/navidrome:/srv/docker/navidrome:ro
    depends_on: [navidrome, gluetun]
    restart: unless-stopped

  # --- Phase 1: Soulseek, only ever through the VPN (brought up in M4) ---
  gluetun:
    image: qmcgaw/gluetun
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    ports: ["127.0.0.1:5030:5030"]          # slskd UI, published on gluetun (shared netns)
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WG_KEY}        # Proton WireGuard config generated WITH "NAT-PMP (Port Forwarding)"
      SERVER_COUNTRIES: Netherlands
      VPN_PORT_FORWARDING: "on"
      PORT_FORWARD_ONLY: "on"
      HTTP_CONTROL_SERVER_ENABLE: "on"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_KEY}"}'
    volumes: ["/srv/docker/gluetun:/gluetun"]
    restart: unless-stopped
  slskd:
    image: slskd/slskd:latest
    user: "1000:1000"
    network_mode: "service:gluetun"
    depends_on: [gluetun]
    environment:
      SLSKD_API_KEY: ${SLSKD_API_KEY}            # what sourcing.cli / fetch authenticate with (X-API-Key)
      SLSKD_SLSK_USERNAME: ${SLSK_USER}
      SLSKD_SLSK_PASSWORD: ${SLSK_PASS}
      SLSKD_VPN: "true"
      SLSKD_VPN_PORT_FORWARDING: "true"
      SLSKD_VPN_GLUETUN_URL: http://localhost:8000
      SLSKD_VPN_GLUETUN_API_KEY: ${GLUETUN_KEY}
      SLSKD_DOWNLOADS_DIR: /app/downloads
      SLSKD_INCOMPLETE_DIR: /app/downloads/.incomplete
      SLSKD_SHARED_DIR: /app/shared
    volumes:
      - /srv/docker/slskd:/app
      - /srv/incoming/soulseek:/app/downloads     # slskd's own folder: library-import is not exposed to it
      - /srv/music:/app/shared:ro
    restart: unless-stopped
